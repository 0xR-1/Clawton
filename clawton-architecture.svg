<svg viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="1500" fill="#0f1117"/>
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Clawton</text>
  <text x="450" y="68" text-anchor="middle" fill="#9aa4b2" font-size="13">Policy-enforced execution for AI agents</text>
  <text x="450" y="85" text-anchor="middle" fill="#9aa4b2" font-size="13">the policy decides, not the agent</text>

  <rect x="210" y="100" width="480" height="50" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="450" y="130" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">User submits a request in natural language</text>
  <line x1="450" y1="150" x2="450" y2="190" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,195 444,183 456,183" fill="#4a5262"/>

  <rect x="210" y="195" width="480" height="70" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="450" y="222" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">OpenClaw Agent</text>
  <text x="450" y="247" text-anchor="middle" fill="#9aa4b2" font-size="11">Routes to the matching guard script</text>
  <line x1="450" y1="265" x2="450" y2="305" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,310 444,298 456,298" fill="#4a5262"/>

  <rect x="210" y="310" width="480" height="70" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="450" y="337" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">Clawton Guard (Node.js)</text>
  <text x="450" y="362" text-anchor="middle" fill="#9aa4b2" font-size="11">Computes live-priced spend value, builds intent</text>
  <line x1="450" y1="380" x2="450" y2="420" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,425 444,413 456,413" fill="#4a5262"/>

  <rect x="210" y="425" width="480" height="80" rx="8" fill="#1b2a3a" stroke="#2f5d8a"/>
  <text x="450" y="455" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">Newton Policy Check #1 — per-transaction cap</text>
  <text x="450" y="480" text-anchor="middle" fill="#8fb8de" font-size="11">Rego rule "allow": spend cap, whitelist, no-withdrawal, admin</text>

  <line x1="450" y1="505" x2="450" y2="540" stroke="#4a5262" stroke-width="2"/>
  <line x1="450" y1="540" x2="450" y2="570" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,575 444,563 456,563" fill="#4a5262"/>
  <line x1="450" y1="540" x2="790" y2="570" stroke="#4a5262" stroke-width="2"/>
  <polygon points="790,575 784,564 795,566" fill="#4a5262"/>

  <rect x="360" y="575" width="180" height="50" rx="8" fill="#173a24" stroke="#2f8a52"/>
  <text x="450" y="605" text-anchor="middle" fill="#7fe3a0" font-size="14" font-weight="700">ALLOWED</text>

  <rect x="700" y="575" width="180" height="50" rx="8" fill="#3a1c1c" stroke="#8a3535"/>
  <text x="790" y="605" text-anchor="middle" fill="#f28b8b" font-size="14" font-weight="700">DENIED</text>
  <line x1="790" y1="625" x2="790" y2="655" stroke="#4a5262" stroke-width="2"/>
  <polygon points="790,660 784,648 796,648" fill="#4a5262"/>
  <rect x="700" y="660" width="180" height="70" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="790" y="686" text-anchor="middle" fill="#e6e9ef" font-size="12" font-weight="600">Blocked</text>
  <text x="790" y="705" text-anchor="middle" fill="#9aa4b2" font-size="10">no order or payment sent</text>
  <text x="790" y="720" text-anchor="middle" fill="#9aa4b2" font-size="10">logged onchain</text>

  <line x1="450" y1="625" x2="450" y2="665" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,670 444,658 456,658" fill="#4a5262"/>

  <rect x="210" y="670" width="480" height="70" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="450" y="697" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">Guard reads cumulative spend</text>
  <text x="450" y="722" text-anchor="middle" fill="#9aa4b2" font-size="11">ClawtonSpendTracker — onchain, 24h window</text>
  <line x1="450" y1="740" x2="450" y2="780" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,785 444,773 456,773" fill="#4a5262"/>

  <rect x="210" y="785" width="480" height="80" rx="8" fill="#1b2a3a" stroke="#2f5d8a"/>
  <text x="450" y="815" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="600">Newton Policy Check #2 — daily cumulative cap</text>
  <text x="450" y="840" text-anchor="middle" fill="#8fb8de" font-size="11">Rego rule "within_daily_limit" — evaluated independently</text>

  <line x1="450" y1="865" x2="450" y2="900" stroke="#4a5262" stroke-width="2"/>
  <line x1="450" y1="900" x2="450" y2="930" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,935 444,923 456,923" fill="#4a5262"/>
  <line x1="450" y1="900" x2="790" y2="930" stroke="#4a5262" stroke-width="2"/>
  <polygon points="790,935 784,924 795,926" fill="#4a5262"/>

  <rect x="360" y="935" width="180" height="50" rx="8" fill="#173a24" stroke="#2f8a52"/>
  <text x="450" y="965" text-anchor="middle" fill="#7fe3a0" font-size="14" font-weight="700">ALLOWED</text>

  <rect x="700" y="935" width="180" height="50" rx="8" fill="#3a1c1c" stroke="#8a3535"/>
  <text x="790" y="965" text-anchor="middle" fill="#f28b8b" font-size="14" font-weight="700">DENIED</text>
  <line x1="790" y1="985" x2="790" y2="1015" stroke="#4a5262" stroke-width="2"/>
  <polygon points="790,1020 784,1008 796,1008" fill="#4a5262"/>
  <rect x="700" y="1020" width="180" height="70" rx="8" fill="#1b1f29" stroke="#3a4150"/>
  <text x="790" y="1046" text-anchor="middle" fill="#e6e9ef" font-size="12" font-weight="600">Blocked</text>
  <text x="790" y="1065" text-anchor="middle" fill="#9aa4b2" font-size="10">daily limit exceeded</text>
  <text x="790" y="1080" text-anchor="middle" fill="#9aa4b2" font-size="10">logged onchain</text>

  <line x1="450" y1="985" x2="450" y2="1010" stroke="#4a5262" stroke-width="2"/>
  <line x1="450" y1="1010" x2="320" y2="1010" stroke="#4a5262" stroke-width="2"/>
  <line x1="320" y1="1010" x2="320" y2="1030" stroke="#4a5262" stroke-width="2"/>
  <polygon points="320,1035 314,1023 326,1023" fill="#4a5262"/>
  <line x1="450" y1="1010" x2="580" y2="1010" stroke="#4a5262" stroke-width="2"/>
  <line x1="580" y1="1010" x2="580" y2="1030" stroke="#4a5262" stroke-width="2"/>
  <polygon points="580,1035 574,1023 586,1023" fill="#4a5262"/>

  <rect x="210" y="1035" width="220" height="80" rx="8" fill="#3a2c14" stroke="#8a6a2f"/>
  <text x="320" y="1062" text-anchor="middle" fill="#e6c68a" font-size="13" font-weight="700">Binance execution</text>
  <text x="320" y="1082" text-anchor="middle" fill="#c9ad7a" font-size="10">order executed on Spot Testnet</text>
  <text x="320" y="1100" text-anchor="middle" fill="#9a8760" font-size="10">guards/binance.js</text>

  <rect x="470" y="1035" width="220" height="80" rx="8" fill="#122a3a" stroke="#2f6a8a"/>
  <text x="580" y="1062" text-anchor="middle" fill="#8ac6e6" font-size="13" font-weight="700">x402 payment</text>
  <text x="580" y="1082" text-anchor="middle" fill="#7aa9c9" font-size="10">signed and settled on Base Sepolia</text>
  <text x="580" y="1100" text-anchor="middle" fill="#60809a" font-size="10">x402-server/x402.js</text>

  <line x1="320" y1="1115" x2="320" y2="1150" stroke="#4a5262" stroke-width="2"/>
  <line x1="580" y1="1115" x2="580" y2="1150" stroke="#4a5262" stroke-width="2"/>
  <line x1="320" y1="1150" x2="580" y2="1150" stroke="#4a5262" stroke-width="2"/>
  <line x1="450" y1="1150" x2="450" y2="1180" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,1185 444,1173 456,1173" fill="#4a5262"/>

  <rect x="210" y="1195" width="480" height="90" rx="8" fill="#12151d" stroke="#2a3040"/>
  <text x="450" y="1225" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="700">Recorded onchain — ClawtonTradeLog</text>
  <text x="450" y="1248" text-anchor="middle" fill="#9aa4b2" font-size="10">Ethereum Sepolia — permanent, verifiable</text>
  <text x="450" y="1266" text-anchor="middle" fill="#9aa4b2" font-size="10">Every ALLOWED and DENIED decision is logged</text>
  <line x1="450" y1="1285" x2="450" y2="1315" stroke="#4a5262" stroke-width="2"/>
  <polygon points="450,1320 444,1308 456,1308" fill="#4a5262"/>

  <rect x="210" y="1330" width="480" height="90" rx="8" fill="#12151d" stroke="#2a3040"/>
  <text x="450" y="1360" text-anchor="middle" fill="#e6e9ef" font-size="14" font-weight="700">Recorded onchain — ClawtonSpendTracker</text>
  <text x="450" y="1383" text-anchor="middle" fill="#9aa4b2" font-size="10">Only when executed — feeds the next daily-limit check</text>
  <text x="450" y="1401" text-anchor="middle" fill="#9aa4b2" font-size="10">Shared across the Binance and x402 paths</text>

  <text x="450" y="1450" text-anchor="middle" fill="#5a6270" font-size="10">Two independent Rego evaluations per action — per-transaction cap, then daily cumulative cap</text>
  <text x="450" y="1468" text-anchor="middle" fill="#5a6270" font-size="10">Both decisions are made by the policy engine, not the guard script</text>
</svg>
