<svg width="900" height="870" viewBox="0 0 900 870" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AC"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F9D55"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D14343"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E3A008"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5AFE"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="870" fill="#FFFFFF"/>

  <text x="450" y="45" text-anchor="middle" font-size="34" font-weight="700" fill="#16181D">Clawton</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#6B7280">Policy-enforced execution for AI agents — the policy decides, not the agent</text>
  <line x1="250" y1="84" x2="650" y2="84" stroke="#E2E5EA" stroke-width="1"/>

  <rect x="250" y="97" width="400" height="50" rx="10" fill="#F7F8FA" stroke="#D7DCE3" stroke-width="1.5"/>
  <text x="450" y="127" text-anchor="middle" font-size="14" fill="#16181D">User submits a request in natural language</text>
  <line x1="450" y1="147" x2="450" y2="168" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="300" y="170" width="300" height="64" rx="10" fill="#F7F8FA" stroke="#D7DCE3" stroke-width="1.5"/>
  <text x="450" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#16181D">OpenClaw Agent</text>
  <text x="450" y="216" text-anchor="middle" font-size="11" fill="#6B7280">Routes to the matching guard script</text>
  <line x1="450" y1="234" x2="450" y2="258" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="270" y="260" width="360" height="64" rx="10" fill="#F7F8FA" stroke="#D7DCE3" stroke-width="1.5"/>
  <text x="450" y="287" text-anchor="middle" font-size="15" font-weight="600" fill="#16181D">Clawton Guard (Node.js)</text>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#6B7280">Computes live price → builds intent</text>
  <line x1="450" y1="324" x2="450" y2="348" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="220" y="350" width="460" height="78" rx="10" fill="#F5F6FA" stroke="#C7CCD6" stroke-width="1.5"/>
  <text x="450" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#16181D">Newton Protocol Policy Check</text>
  <text x="450" y="398" text-anchor="middle" font-size="11.5" fill="#6B7280">Rego policy evaluated against the onchain Policy contract</text>
  <text x="450" y="414" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8890A0">fail-closed: any undefined condition → deny</text>

  <path d="M450,428 L450,450 L245,450 L245,468" fill="none" stroke="#1F9D55" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M450,428 L450,450 L655,450 L655,468" fill="none" stroke="#D14343" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="110" y="470" width="270" height="56" rx="10" fill="#E6F6ED" stroke="#1F9D55" stroke-width="1.5"/>
  <text x="245" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">✓ ALLOWED</text>

  <rect x="520" y="470" width="270" height="56" rx="10" fill="#FDEAEA" stroke="#D14343" stroke-width="1.5"/>
  <text x="655" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#7A1F1F">✕ DENIED</text>

  <path d="M245,526 L245,548 L150,548 L150,568" fill="none" stroke="#E3A008" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M245,526 L245,548 L340,548 L340,568" fill="none" stroke="#3D5AFE" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M655,526 L655,568" fill="none" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="60" y="570" width="180" height="86" rx="10" fill="#FFF4DC" stroke="#E3A008" stroke-width="1.5"/>
  <text x="150" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4E00">Binance</text>
  <text x="150" y="609" text-anchor="middle" font-size="10.5" fill="#7A4E00">order executed on</text>
  <text x="150" y="624" text-anchor="middle" font-size="10.5" fill="#7A4E00">Spot Testnet</text>
  <text x="150" y="641" text-anchor="middle" font-size="9.5" font-family="Courier New, monospace" fill="#9A7A2E">guards/binance.js</text>

  <rect x="250" y="570" width="180" height="86" rx="10" fill="#E7EEFF" stroke="#3D5AFE" stroke-width="1.5"/>
  <text x="340" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A9E">x402 payment</text>
  <text x="340" y="609" text-anchor="middle" font-size="10.5" fill="#1E3A9E">signed &amp; settled on</text>
  <text x="340" y="624" text-anchor="middle" font-size="10.5" fill="#1E3A9E">Base Sepolia</text>
  <text x="340" y="641" text-anchor="middle" font-size="9.5" font-family="Courier New, monospace" fill="#5B6FC7">x402-server/x402.js</text>

  <rect x="565" y="570" width="180" height="86" rx="10" fill="#F1F2F4" stroke="#9AA1AC" stroke-width="1.5"/>
  <text x="655" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3F47">Blocked</text>
  <text x="655" y="615" text-anchor="middle" font-size="10.5" fill="#3A3F47">no order placed,</text>
  <text x="655" y="630" text-anchor="middle" font-size="10.5" fill="#3A3F47">no payment signed</text>
  <text x="655" y="645" text-anchor="middle" font-size="9.5" font-style="italic" fill="#7C828B">fails closed, not open</text>

  <path d="M150,656 L150,678" fill="none" stroke="#9AA1AC" stroke-width="1.5"/>
  <path d="M340,656 L340,678" fill="none" stroke="#9AA1AC" stroke-width="1.5"/>
  <path d="M655,656 L655,678" fill="none" stroke="#9AA1AC" stroke-width="1.5"/>
  <line x1="150" y1="678" x2="655" y2="678" stroke="#9AA1AC" stroke-width="1.5"/>
  <line x1="450" y1="678" x2="450" y2="714" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="150" y="716" width="600" height="90" rx="12" fill="#16192B"/>
  <text x="450" y="748" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Recorded Onchain — ClawtonTradeLog</text>
  <text x="450" y="768" text-anchor="middle" font-size="11.5" fill="#C7CCD6">Ethereum Sepolia · permanent · independently verifiable</text>
  <text x="450" y="785" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9AA1AC">Every ALLOWED and DENIED decision is logged, not just successes</text>

  <circle cx="170" cy="828" r="6" fill="#E3A008"/>
  <text x="182" y="832" font-size="11" fill="#6B7280">Binance path</text>
  <circle cx="290" cy="828" r="6" fill="#3D5AFE"/>
  <text x="302" y="832" font-size="11" fill="#6B7280">x402 path</text>
  <text x="740" y="832" text-anchor="end" font-size="11" fill="#9AA1AC">github.com/0xR-1/Clawton</text>
</svg>
